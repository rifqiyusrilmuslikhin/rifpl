[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-model"
version = "0.1.0"
description = "Reproducible research pipeline for next-gameweek FPL decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "FPL Model contributors" }]
dependencies = [
    "numpy==2.2.3",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fpl_model.features" = ["*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
